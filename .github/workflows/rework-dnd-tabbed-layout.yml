name: Reorganizar ficha D&D em abas

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/rework-dnd-tabbed-layout.mjs'
      - '.github/workflows/rework-dnd-tabbed-layout.yml'

permissions:
  contents: write

jobs:
  rework-dnd-tabs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar projeto
        run: npm ci

      - name: Aplicar layout em abas
        run: node scripts/rework-dnd-tabbed-layout.mjs

      - name: Validar estrutura e build
        run: npm run check

      - name: Commitar alteração
        run: |
          if git diff --quiet; then
            echo 'Nada para commitar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pjlite.css src/systems/dnd5e/components/CharacterEditor.jsx
          git commit -m 'Reorganiza ficha D&D 5.5e em três abas responsivas'
          git push
