name: PJ Lite CI

on:
  push:
    branches: [ main, preview/cloud-sync ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar estrutura e build
        run: npm run check

      - name: Empacotar build da migração
        uses: actions/upload-artifact@v4
        with:
          name: pjlite-0.9.1-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

      - name: Publicar snapshot 0.9.1 para produção
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          rm -rf /tmp/pjlite-dist
          mkdir -p /tmp/pjlite-dist
          cp -a dist/. /tmp/pjlite-dist/
          git config user.name "PJ Lite CI"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan production-dist
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/pjlite-dist/. .
          printf "PJ Lite 0.9.1v Alpha\nSource: %s\n" "$GITHUB_SHA" > .pjlite-release
          git add -A
          git commit -m "Build PJ Lite 0.9.1v Alpha ($GITHUB_SHA)"
          git push --force origin HEAD:production-dist
