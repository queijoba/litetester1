name: Reparar template PDF 3DeT

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/repair-3det-template.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar PyMuPDF
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: Limpar estrutura do PDF preservando AcroForm
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path

          src = Path('public/pdfs/3det-template.pdf')
          tmp = Path('public/pdfs/3det-template.clean.pdf')

          doc = fitz.open(src)
          if doc.page_count != 1:
              raise SystemExit(f'Template 3DeT inesperado: {doc.page_count} páginas')
          doc.save(
              tmp,
              garbage=4,
              clean=True,
              deflate=True,
              deflate_fonts=True,
              deflate_images=True,
          )
          doc.close()

          check = fitz.open(tmp)
          widgets = list(check[0].widgets() or [])
          names = {w.field_name for w in widgets if w.field_name}
          required = {
              'retrato_personagem', 'bio_nome', 'escala', 'atributo_poder',
              'pericia_linha_1', 'vantagens', 'tecnicas', 'inventario', 'anotacoes'
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f'Campos perdidos na limpeza: {missing}')
          if len(widgets) < 38:
              raise SystemExit(f'Esperava pelo menos 38 campos, encontrei {len(widgets)}')
          check.close()

          tmp.replace(src)
          PY

      - name: Atualizar exportador para o template reparado
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/systems/3det/pdf/export.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "const TEMPLATE_URL = '/pdfs/3det-template.pdf?v=20260930';",
              "const TEMPLATE_URL = '/pdfs/3det-template.pdf?v=20260930c';"
          )
          text = text.replace(
              "const bytes = await doc.save({ useObjectStreams: false, updateFieldAppearances: false });",
              "const bytes = await doc.save({ useObjectStreams: true, updateFieldAppearances: false });"
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name 'Nick'
          git config user.email '90225335+queijoba@users.noreply.github.com'
          git add public/pdfs/3det-template.pdf src/systems/3det/pdf/export.js
          git commit -m 'Repara compatibilidade do PDF 3DeT'
          git push origin HEAD:main
