name: Finalizar nomenclatura D&D

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-copy-fix.yml'

permissions:
  contents: write

jobs:
  fix-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ajustar texto restante
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/PJLiteApp.jsx')
          text = p.read_text()
          old = 'Dragonbane usa PNJs e monstros; D&D 5e usa blocos de estatísticas; Fabula Ultima usa Ameaças/PNJs; O Som das Seis usa PDJs.'
          new = 'Dragonbane usa PNJs e monstros; D&D 5.5e usa blocos de estatísticas; Fabula Ultima usa Ameaças/PNJs; O Som das Seis usa PDJs.'
          if old not in text:
              raise SystemExit('Texto alvo não encontrado')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validar projeto
        run: npm ci && npm run check

      - name: Commitar ajuste
        run: |
          git config user.name "PJ Lite Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/PJLiteApp.jsx
          git commit -m "Finaliza nomenclatura D&D 5.5e nos guias"
          git push origin HEAD:main
