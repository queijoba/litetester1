name: Revisão final pré-lançamento

on:
  push:
    branches: [main]
    paths:
      - 'scripts/prelaunch-polish.mjs'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar revisão final
        run: node scripts/prelaunch-polish.mjs

      - name: Validar projeto
        run: npm ci && npm run check

      - name: Commitar revisão
        run: |
          git config user.name "PJ Lite Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/PJLiteApp.jsx src/systems/registry.js src/systems/dnd5e/index.js scripts/verify-project.mjs
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Revisa textos e validações antes do lançamento"
          git push origin HEAD:main
