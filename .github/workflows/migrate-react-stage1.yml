name: Migrar PJ Lite para React/Vite - Etapa 1

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/migrate-react-stage1.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar estrutura React/Vite
        run: python scripts/migrate_stage1.py

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Validar build Vite
        run: npm run build

      - name: Registrar migração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrar PJ Lite para React/Vite - etapa de compatibilidade"
          git push origin main
