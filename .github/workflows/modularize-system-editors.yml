name: Modularizar editores de sistema

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/modularize-system-editors.mjs'
      - '.github/workflows/modularize-system-editors.yml'

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar projeto
        run: npm ci

      - name: Instalar parser temporário do codemod
        run: npm install --no-save --package-lock=false @babel/parser @babel/traverse

      - name: Separar editores
        run: node scripts/modularize-system-editors.mjs

      - name: Validar estrutura e build
        run: npm run check

      - name: Commitar modularização
        run: |
          if git diff --quiet; then
            echo 'Nada para commitar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/PJLiteApp.jsx src/systems/dragonbane/components src/systems/dnd5e/components src/systems/fabulaUltima/components src/systems/somDasSeis/components
          git commit -m 'Separa editores visuais por sistema'
          git push
