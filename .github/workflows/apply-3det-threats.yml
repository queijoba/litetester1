name: Aplicar ameaças 3DeT

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/apply-3det-threats-patch.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar integração de ameaças 3DeT
        run: node scripts/apply-3det-threats-patch.mjs

      - name: Commit da integração
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "PJ Lite Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/PJLiteApp.jsx
          git commit -m "Integra Ameaças e NPCs de 3DeT Victory"
          git push
