name: Inspecionar PDF 3DeT

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-3det-pdf.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar pypdf
        run: pip install pypdf
      - name: Listar campos e texto
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          path = Path('public/pdfs/3DeT_Victory_PJlite_A4_Horizontal_Editavel (2).pdf')
          r = PdfReader(str(path))
          print('PAGES', len(r.pages))
          fields = r.get_fields() or {}
          print('FIELD_COUNT', len(fields))
          for name, field in fields.items():
              print(f"FIELD|{name}|FT={field.get('/FT')}|V={field.get('/V')}|Ff={field.get('/Ff')}|OPT={field.get('/Opt')}")
          print('--- PAGE TEXT ---')
          print(r.pages[0].extract_text() or '')
          print('--- WIDGETS ---')
          for page_index, page in enumerate(r.pages):
              for ref in page.get('/Annots', []) or []:
                  a = ref.get_object()
                  if a.get('/Subtype') != '/Widget':
                      continue
                  parent = a.get('/Parent')
                  p = parent.get_object() if parent else a
                  name = p.get('/T') or a.get('/T')
                  print(f"WIDGET|p={page_index+1}|{name}|FT={p.get('/FT')}|RECT={a.get('/Rect')}")
          PY
