name: Integrate 3DeT preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-3det-preview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply 3DeT integration
        run: python scripts/integrate-3det-preview.py

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PJLiteApp.jsx src/systems/3det/components/CharacterEditor.jsx src/systems/dragonbane/components/Editor.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Integra 3DeT Victory à prévia do PJ Lite"
          git push
