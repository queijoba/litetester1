name: PJLite - Release isolada Ordem Paranormal
on:
  push:
    branches: [ release/ordem-hexatombe-definitivo-20261124 ]
permissions:
  contents: write
jobs:
  validate-and-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da fonte isolada
        uses: actions/checkout@v4
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm install
      - name: Validar todos os sistemas e gerar compilação
        run: npm run check
      - name: Guardar build para auditoria
        uses: actions/upload-artifact@v4
        with:
          name: pjlite-ordem-only-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3
      - name: Publicar snapshot de produção isolado
        run: |
          set -e
          mkdir -p /tmp/pjlite-ordem-dist
          cp -a dist/. /tmp/pjlite-ordem-dist/
          git config user.name "PJLite CI"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan release-ordem-dist-20261124
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/pjlite-ordem-dist/. .
          printf "PJ Lite 1.1.3v Alpha\nSource: %s\nScope: Ordem Paranormal dossier and Hexatombe only\n" "$GITHUB_SHA" > .pjlite-release
          git add -A
          git commit -m "Build Ordem Paranormal isolado ($GITHUB_SHA)"
          git push --force origin HEAD:refs/heads/release-ordem-dist-20261124
