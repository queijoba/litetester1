name: Duplicar PJLite-1

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/duplicate-pjlite.yml'

permissions:
  contents: write

jobs:
  duplicate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório de destino
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clonar PJLite-1
        run: git clone --depth 1 https://github.com/queijoba/PJLite-1.git /tmp/pjlite-source

      - name: Substituir conteúdo pelo projeto original
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/pjlite-source/ ./

      - name: Commitar cópia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Duplicar PJLite-1 para ambiente de testes" || exit 0
          git push origin main
