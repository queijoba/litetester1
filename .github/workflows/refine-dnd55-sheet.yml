name: Refinar ficha D&D 5.5e

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refine-dnd55-sheet.mjs'
      - '.github/workflows/refine-dnd55-sheet.yml'

permissions:
  contents: write

jobs:
  refine-dnd55:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar projeto
        run: npm ci

      - name: Corrigir seletor único do codemod
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/refine-dnd55-sheet.mjs')
          s = p.read_text()
          old = '''editor = replaceOnce(
            editor,
            "  return (\\n",
            "  const dndFeatureGroups = [\\n    { id: 'classe', label: 'Características de Classe' },\\n    { id: 'especie', label: 'Características de Espécie' },\\n    { id: 'talento', label: 'Talentos' },\\n    { id: 'outro', label: 'Outros Recursos' }\\n  ];\\n  const dndAttunements = Array.isArray(data.sintonizacao) ? data.sintonizacao : ['', '', ''];\\n\\n  return (\\n",
            'helpers visuais D&D'
          );'''
          new = '''editor = replaceOnce(
            editor,
            "  } = scope;\\n\\n  return (\\n",
            "  } = scope;\\n\\n  const dndFeatureGroups = [\\n    { id: 'classe', label: 'Características de Classe' },\\n    { id: 'especie', label: 'Características de Espécie' },\\n    { id: 'talento', label: 'Talentos' },\\n    { id: 'outro', label: 'Outros Recursos' }\\n  ];\\n  const dndAttunements = Array.isArray(data.sintonizacao) ? data.sintonizacao : ['', '', ''];\\n\\n  return (\\n",
            'helpers visuais D&D'
          );'''
          if old not in s:
              raise SystemExit('Bloco do seletor antigo não encontrado.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Aplicar refinamento D&D 5.5e
        run: node scripts/refine-dnd55-sheet.mjs

      - name: Validar estrutura e build
        run: npm run check

      - name: Commitar refinamento
        run: |
          if git diff --quiet; then
            echo 'Nada para commitar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/refine-dnd55-sheet.mjs src/PJLiteApp.jsx src/pjlite.css src/systems/dnd5e/components/CharacterEditor.jsx
          git commit -m 'Refina ficha D&D 5.5e com base no modelo 2024'
          git push
