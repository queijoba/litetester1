name: Refinar ficha D&D 5.5e

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refine-dnd55-sheet.mjs'
      - 'scripts/repair-refine-dnd55.mjs'
      - '.github/workflows/refine-dnd55-sheet.yml'

permissions:
  contents: write

jobs:
  refine-dnd55:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar projeto
        run: npm ci

      - name: Preparar codemod
        run: node scripts/repair-refine-dnd55.mjs

      - name: Aplicar refinamento D&D 5.5e
        run: node scripts/refine-dnd55-sheet.mjs

      - name: Validar estrutura e build
        run: npm run check

      - name: Commitar refinamento
        run: |
          if git diff --quiet; then
            echo 'Nada para commitar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/refine-dnd55-sheet.mjs src/PJLiteApp.jsx src/pjlite.css src/systems/dnd5e/components/CharacterEditor.jsx
          git commit -m 'Refina ficha D&D 5.5e com base no modelo 2024'
          git push
