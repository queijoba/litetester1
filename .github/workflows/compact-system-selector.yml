name: Compactar seletor de sistemas

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/compact-system-selector.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar layout compacto
        run: node scripts/compact-system-selector.mjs
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "PJ Lite Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/PJLiteApp.jsx
          git commit -m "Organiza seletor de sistemas em grade compacta"
          git push
