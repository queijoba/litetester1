name: Atualizar prévia 0.7.4v

on:
  push:
    branches: [main]
    paths:
      - 'scripts/release-074.mjs'

permissions:
  contents: write

jobs:
  release-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar atualização 0.7.4v
        run: node scripts/release-074.mjs

      - name: Validar projeto
        run: npm ci && npm run check

      - name: Commitar atualização
        run: |
          git config user.name "PJ Lite Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/PJLiteApp.jsx index.html package.json package-lock.json README.md scripts/verify-project.mjs
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Atualiza prévia para 0.7.4v Alpha"
          git push origin HEAD:main
